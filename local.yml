services:
  traefik:
    image: docker.io/traefik:v3.6
    restart: unless-stopped
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./backend/docker/local/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
    networks:
      - modern_bank_fraud_detection_network

  api: &api
    build:
      context: .
      dockerfile: ./backend/docker/local/fastapi/Dockerfile
    volumes:
      - .:/src
      - ./backend/app/logs:/src/backend/app/logs
    ports:
      - "8000:8000"
    env_file:
      - ./.envs/.env.local
    depends_on:
      - postgres
      - mailpit
    command:
      /start.sh
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.routers.api.rule=Host(`api.localhost`)"
      - "traefik.http.routers.api.service=api-service"
      - "traefik.http.services.api-service.loadbalancer.server.port=8000"
    networks:
      - modern_bank_fraud_detection_network

  mailpit:
    image: docker.io/axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"
    volumes:
      - mailpit_data:/data
    environment:
      - MP_MAX_MESSAGES=500
      - MP_DATA_FILE=/data/mailpit.db
      - MP_SMTP_AUTH_ACCEPT_ANY=1
      - MP_SMTP_AUTH_ALLOW_INSECURE=1
    networks:
      - modern_bank_fraud_detection_network
    
  postgres:
    container_name: postgres
    build:
      context: ./backend/docker/local/postgres/
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5432:5432"
    env_file:
      - ./.envs/.env.local
    volumes:
      - modern_bank_fraud_detection_postgres_data:/var/lib/postgresql/data
    networks:
      - modern_bank_fraud_detection_network

volumes:
  modern_bank_fraud_detection_postgres_data:
  mailpit_data:

networks:
  modern_bank_fraud_detection_network:
    external: true